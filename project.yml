# XcodeGen 선언 — 이 파일이 프로젝트 구조의 단일 진실원.
# 파일/폴더를 추가·이동한 뒤 `xcodegen generate` 를 실행하면 sttak.xcodeproj 가 재생성됨.
# .xcodeproj 는 생성물이라 .gitignore 로 추적하지 않음.

name: sttak

options:
  bundleIdPrefix: com.sttak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 개인 개발팀 미설정 상태로 시뮬레이터 빌드 가능. 실기기 빌드 시 Xcode에서 팀 선택.
    CODE_SIGN_STYLE: Automatic

targets:
  sttak:
    type: application
    platform: iOS
    # MVP 진행에 따라 Domain/Data/Features/Resources 폴더를 아래에 추가 등록한다.
    sources:
      - path: App
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sttak.app
        PRODUCT_NAME: sttak
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"  # iPhone 전용
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: sttak
